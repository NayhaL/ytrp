services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lar-db}
      POSTGRES_USER: ${POSTGRES_USER:-lar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lar-local-dev-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lar-db}
      PGUSER: ${POSTGRES_USER:-lar}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lar-local-dev-only}
      COMPANY_API_URL: ${COMPANY_API_URL:-https://avoindata.prh.fi/opendata-ytj-api/v3/all_companies}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-6969}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
